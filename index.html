function generateWeeklyReport(){
  const start=document.getElementById('reportStart').value||todayStr();
  const end=document.getElementById('reportEnd').value||todayStr();
  if(start>end){alert('起始日期不能晚于结束日期');return}

  const PRI={P0:0,P1:1,P2:2,P3:3};

  // A 类：该时段内有进展记录增加的任务
  const progressMap=new Map();
  state.todos.forEach(t=>{
    const prog=(t.journal||[]).filter(j=>j.date>=start&&j.date<=end);
    if(prog.length>0) progressMap.set(t.id,prog);
  });

  // B 类：deadline 落在时段内（含逾期 / 已完成 / 未完成）
  const dueMap=new Map();
  state.todos.forEach(t=>{
    if(t.deadline&&t.deadline>=start&&t.deadline<=end) dueMap.set(t.id,t);
  });

  // 合并去重
  const merged=new Map();
  progressMap.forEach((prog,id)=>merged.set(id,{todo:state.todos.find(x=>x.id===id),progress:prog,inDue:dueMap.has(id)}));
  dueMap.forEach((t,id)=>{ if(!merged.has(id)) merged.set(id,{todo:t,progress:progressMap.get(id)||[],inDue:true}); });

  const allTasks=[...merged.values()].map(v=>v.todo);
  const progressCount=progressMap.size;
  const dueCount=dueMap.size;
  const doneCount=allTasks.filter(t=>t.done).length;
  const overdueNow=allTasks.filter(t=>!t.done&&t.deadline&&daysOverdue(t.deadline)>0).length;

  // 按项目分组
  const groups=new Map();
  merged.forEach((v,id)=>{
    const pid=v.todo.projectId||null;
    if(!groups.has(pid))groups.set(pid,[]);
    groups.get(pid).push(v);
  });
  const groupKeys=[...groups.keys()].sort((a,b)=>{
    if(a===null)return 1; if(b===null)return -1;
    return getProjectName(a).localeCompare(getProjectName(b),'zh');
  });

  // 概览天数
  let dayCount=1;
  try{ dayCount=Math.floor((new Date(end)-new Date(start))/86400000)+1; }catch(e){}
  if(dayCount<1)dayCount=1;

  let md=`# 工作周报（${start} ~ ${end}）\n\n`;
  md+=`> 由「办公工作台」自动生成 · 生成日期 ${todayStr()}\n\n`;
  md+=`## 一、概览\n\n`;
  md+=`- 统计区间：${start} 至 ${end}（共 ${dayCount} 天）\n`;
  md+=`- 涉及任务总数：**${allTasks.length}**\n`;
  md+=`- 期间有进展更新的任务：${progressCount} 个\n`;
  md+=`- 计划在该区间完成（含逾期）的任务：${dueCount} 个（已完成 ${doneCount} 个 / 未完成 ${allTasks.length-doneCount} 个）\n`;
  if(overdueNow>0) md+=`- 截至今日仍逾期：${overdueNow} 个 ⚠️\n`;
  md+=`\n`;

  md+=`## 二、按项目汇总\n\n`;
  groupKeys.forEach(pid=>{
    const name=pid?getProjectName(pid):'未关联项目';
    md+=`### ${pid?'项目':'▫️'}：${name}\n\n`;
    if(pid){
      const p=state.projects.find(x=>x.id===pid);
      if(p){
        const steps=[];
        if(p.currentStep)steps.push(`当前进展：${p.currentStep}`);
        if(p.nextStep)steps.push(`下一步：${p.nextStep}`);
        if(p.blocked)steps.push(`状态：⚠️ 卡住（${p.blockedNote||'未说明'}）`);
        if(steps.length)md+=`> ${steps.join('；')}\n\n`;
      }
    }
    const entries=groups.get(pid).slice().sort((x,y)=>(PRI[x.todo.priority]??9)-(PRI[y.todo.priority]??9));
    entries.forEach(v=>{
      const t=v.todo;
      const pLabel=PRIORITY_LABELS[t.priority]||t.priority;
      const pColor=PRIORITY_COLORS[t.priority]||'#334155';
      let status='';
      if(t.done)status='✅ 已完成';
      else if(t.deadline&&daysOverdue(t.deadline)>0)status=`⚠️ 逾期 ${daysOverdue(t.deadline)} 天`;
      else status='⬜ 待办';
      const dl=t.deadline?`（截止 ${t.deadline}）`:'（无截止日期）';
      const why=[];
      if(v.progress.length>0)why.push('📝有进展');
      if(v.inDue)why.push('🎯计划完成');
      md+=`- **<span style="color:${pColor}">[${pLabel}]</span> ${t.title}** ${dl} — ${status}${why.length?`（${why.join(' · ')}）`:''}\n`;
      const prog=v.progress.slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
      if(prog.length>0){
        md+=`  - 进展记录：\n`;
        prog.forEach(j=>{
          const dt=fmtDateTime(j.createdAt)||j.date;
          const col=j.color?` style="color:${j.color}"`:'';
          md+=`    - <span${col}>${dt}：${j.content}</span>\n`;
        });
      }
    });
    md+=`\n`;
  });

  // 三、下周重点（未完成 / 逾期）
  const pendingSorted=sortTodosUnified(allTasks.filter(t=>!t.done));
  if(pendingSorted.length>0){
    md+=`## 三、下周重点（未完成 / 逾期）\n\n`;
    pendingSorted.forEach(t=>{
      const pLabel=PRIORITY_LABELS[t.priority]||t.priority;
      const pColor=PRIORITY_COLORS[t.priority]||'#334155';
      const proj=t.projectId?getProjectName(t.projectId):'未关联项目';

      md+=`- <span style="color:${pColor}">[${pLabel}]</span> ${t.title}（${proj}）— ${od}\n`;
    });
    md+=`\n`;
  }

  md+=`---\n\n*本报告由办公工作台自动汇总生成。*\n`;

  window._weeklyReportMd=md;

// ===== Charts =====
function renderPieChart(data){
  if(data.length===0)return'<div class="chart-empty">本周暂无完成记录</div>';
  const total=data.reduce((s,d)=>s+d.value,0);
  const cx=70,cy=70,r=55;
  let paths='';
  if(data.length===1){
    paths=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${data[0].color}"/>`;
  }else{
    let angle=-90;
    data.forEach(d=>{
      const sweep=(d.value/total)*360;
      const a1=angle*Math.PI/180,a2=(angle+sweep)*Math.PI/180;
      const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
      const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
      const la=sweep>180?1:0;
      paths+=`<path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${la} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${d.color}"/>`;
      angle+=sweep;
    });
  }
  const legend=data.map(d=>`<div class="legend-item"><span class="legend-dot" style="background:${d.color}"></span>${d.label} (${d.value})</div>`).join('');
  return`<div class="chart-with-legend">
    <svg viewBox="0 0 140 140" width="120" height="120"><circle cx="${cx}" cy="${cy}" r="${r+3}" fill="#f8fafc"/>${paths}<circle cx="${cx}" cy="${cy}" r="25" fill="#fff"/><text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">${total}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="10" fill="#94a3b8">总计</text></svg>
    <div class="chart-legend">${legend}</div>
  </div>`;
}

function renderProjectBar(completed){
  const pids=[...new Set(completed.map(t=>t.projectId).filter(Boolean))];
  if(pids.length===0&&completed.filter(t=>!t.projectId).length===0)return'<div class="chart-empty">本周暂无项目相关完成记录</div>';
  
  const data=[];
  pids.forEach(pid=>{
    const cnt=completed.filter(t=>t.projectId===pid).length;
    data.push({label:getProjectName(pid)||'已删除',value:cnt});
  });
  const noProj=completed.filter(t=>!t.projectId).length;
  if(noProj>0)data.push({label:'独立任务',value:noProj});
  data.sort((a,b)=>b.value-a.value);
  
  const maxV=Math.max(...data.map(d=>d.value),1);
  const barH=24,gap=8,labelW=90,chartW=160;
  let bars='';
  data.forEach((d,i)=>{
    const w=(d.value/maxV)*chartW;
    const y=i*(barH+gap);
    const lbl=d.label.length>7?d.name?.substring(0,7)+'…':d.label.substring(0,7)+(d.label.length>7?'…':'');
    bars+=`<text x="0" y="${y+16}" font-size="12" fill="#64748b">${esc(lbl)}</text>
    <rect x="${labelW}" y="${y}" width="${chartW}" height="${barH}" fill="#f1f5f9" rx="4"/>
    <rect x="${labelW}" y="${y}" width="${w.toFixed(1)}" height="${barH}" fill="#0d9488" rx="4"/>
    <text x="${labelW+w+6}" y="${y+16}" font-size="12" fill="#1e293b" font-weight="600">${d.value}件</text>`;
  });
  const th=data.length*(barH+gap);
  return`<svg viewBox="0 0 300 ${th}" width="100%" height="${th}" style="max-width:100%;overflow:visible">${bars}</svg>`;
}

function exportData(){
  const data={version:'1.0',exportDate:new Date().toISOString(),
    data:{todos:state.todos,notes:state.notes,projects:state.projects}};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='office_workbench_'+todayStr()+'.json';
  a.click();URL.revokeObjectURL(url);
}
function importData(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      const d=data.data||data;
      if(!Array.isArray(d.todos)||!Array.isArray(d.notes)||!Array.isArray(d.projects))throw new Error('格式不正确');
      state.todos=d.todos;state.notes=d.notes;state.projects=d.projects;
      save();renderAll();
      alert('导入成功！共 '+ (d.todos.length+d.notes.length+d.projects.length) +' 条数据');
    }catch(err){alert('导入失败：'+err.message)}
  };
  reader.readAsText(file);
  event.target.value='';
}

async function init(){
  load();
  if(!localStorage.getItem(SK.sample)&&state.todos.length===0&&state.notes.length===0&&state.projects.length===0){

  renderAll();
  initGistSync(); // 异步初始化云端，不阻塞页面渲染
}
init();
